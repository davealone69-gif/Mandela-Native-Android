name: Build Real APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix missing debug.keystore reference
        run: |
          # Remove custom signingConfig that points to non-existent file so default debug key works
          sed -i '/signingConfigs {/,/}/d' app/build.gradle.kts || true
          sed -i '/create("debugConfig")/,/}/d' app/build.gradle.kts || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Summary
        run: |
          echo "### APK Ready" >> $GITHUB_STEP_SUMMARY
          echo "Download from the GitHub Actions Artifacts tab." >> $GITHUB_STEP_SUMMARY

  publish-latest-apk:
    name: Publish latest APK download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release-apk
      - name: Stage direct APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/latest-debug.apk
      - name: Publish latest debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: Latest Android debug build #${{ github.run_number }}
          body: |
            Automated debug/test APK from commit ${{ github.sha }}.
            This is not a production-signed release.
          files: release-assets/latest-debug.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
